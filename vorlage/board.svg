  <!-- R = r/sqrt(3) = 80.8290 um jedes Hauszentrum -->
  <!-- 4 Mulden pro Haus, Achse zeigt zum Brettzentrum -->
  <!-- Winkel relativ zur Haus->Zentrum-Achse: -->
  <!--   entlang der Achse (nach aussen), +/-60 innen -->
  <!-- ================================================= -->

  <!-- LINKES HAUS (157.5128, 560), Achse nach links (aussen) -->
  <circle cx="76.6838"  cy="560" r="15" fill="none" stroke="red" stroke-width="2"/>
  <circle cx="197.9273" cy="490" r="15" fill="none" stroke="red" stroke-width="2"/>
